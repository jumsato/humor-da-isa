<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a3fb0">
    <meta charset="UTF-8">
    <title>Calendário da Isa 🌈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Filtro que "recorta" o fundo preto da foto do pé, tornando-o transparente -->
    <svg width="0" height="0" style="position:absolute; overflow:hidden;" aria-hidden="true">
        <defs>
            <filter id="chaveia-preto" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
                <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="luminancia"/>
                <feComponentTransfer in="luminancia" result="mascara">
                    <feFuncA type="gamma" amplitude="1" exponent="0.35" offset="0"/>
                </feComponentTransfer>
                <feComposite in="SourceGraphic" in2="mascara" operator="in"/>
            </filter>
        </defs>
    </svg>

    <!-- Ilustrações decorativas ao redor do calendário -->
    <div class="decoracoes" aria-hidden="true">
        <span class="deco d1">🌸</span>
        <span class="deco d2">⭐</span>
        <span class="deco d3">🎀</span>
        <span class="deco d4">☁️</span>
        <span class="deco d5">💜</span>
        <span class="deco d6">✨</span>
        <span class="deco deco-foto d7 moldura-flutuante">
            <img class="foto-recorte" src="deco-foto-1.jpg" alt="">
        </span>
        <img class="deco deco-foto d8" src="deco-foto-5.jpg" alt="">
        <img class="deco deco-foto d9" src="deco-foto-3.jpg" alt="">
        <img class="deco deco-foto d10 foco-rosto" src="deco-foto-6.jpg" alt="">
        <img class="deco deco-foto d11" src="deco-foto-7.jpg" alt="">
    </div>

    <h1>Calendário da Isa 🌈</h1>

    <div class="cartao-calendario">
        <!-- Foto -->
        <div class="fotos-isa">
            <img src="icon-3.png.png" alt="Isa" class="foto-isa">
        </div>

        <!-- Pergunta -->
        <h2 class="pergunta">Como você está se sentindo hoje, Isa?</h2>

        <!-- Navegação de mês -->
        <div class="navegacao-mes">
            <button class="seta" onclick="mesAnterior()" aria-label="Mês anterior">◀</button>
            <h2 id="mesAtual"></h2>
            <button class="seta" onclick="mesProximo()" aria-label="Próximo mês">▶</button>
        </div>

        <!-- Calendário -->
        <div id="calendario"></div>

        <!-- Botão para abrir gráficos -->
        <button class="btn-grafico" onclick="abrirGrafico()"><span>📊</span> Ver Gráficos</button>
    </div>

    <!-- Modal de preenchimento -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="modalData"></h3>

            <div class="grupo-variavel">
                <p class="titulo-variavel">😊 Humor</p>
                <div class="opcoes" data-grupo="humor">
                    <button data-valor="👍🏾" onclick="salvarModal('humor','👍🏾')">👍🏾 Bem</button>
                    <button data-valor="🙂" onclick="salvarModal('humor','🙂')">🙂 Ok</button>
                    <button data-valor="👎🏾" onclick="salvarModal('humor','👎🏾')">👎🏾 Mal</button>
                    <button data-valor="👎🏾👎🏾" onclick="salvarModal('humor','👎🏾👎🏾')">👎🏾👎🏾 Muito mal</button>
                </div>
                <button class="limpar" onclick="limparModal('humor')">✕ Limpar</button>
            </div>

            <div class="grupo-variavel">
                <p class="titulo-variavel">😴 Sono</p>
                <div class="opcoes" data-grupo="sono">
                    <button data-valor="😌" onclick="salvarModal('sono','😌')">😌 Disposta</button>
                    <button data-valor="🥱" onclick="salvarModal('sono','🥱')">🥱 Com sono</button>
                    <button data-valor="😴" onclick="salvarModal('sono','😴')">😴 Muito sono</button>
                    <button data-valor="💤" onclick="salvarModal('sono','💤')">💤 Me arrastando</button>
                </div>
                <button class="limpar" onclick="limparModal('sono')">✕ Limpar</button>
            </div>

            <div class="grupo-variavel">
                <p class="titulo-variavel">🩸 Menstruação</p>
                <div class="opcoes" data-grupo="menstruacao">
                    <button data-valor="inicio" onclick="salvarModal('menstruacao','inicio')">👿 Início</button>
                    <button data-valor="fim" onclick="salvarModal('menstruacao','fim')">👩🏾‍🎤 Fim</button>
                    <button data-valor="pouco" onclick="salvarModal('menstruacao','pouco')">🩸 Pouco</button>
                    <button data-valor="moderado" onclick="salvarModal('menstruacao','moderado')">🩸🩸 Moderado</button>
                    <button data-valor="intenso" onclick="salvarModal('menstruacao','intenso')">🩸🩸🩸 Intenso</button>
                    <button data-valor="muito-intenso" onclick="salvarModal('menstruacao','muito-intenso')">🩸🩸🩸🩸 Muito intenso</button>
                </div>
                <button class="limpar" onclick="limparModal('menstruacao')">✕ Limpar</button>
            </div>

            <div class="grupo-variavel">
                <p class="titulo-variavel">🤯 Níveis de TOC</p>
                <div class="opcoes" data-grupo="toc">
                    <button data-valor="🕊️" onclick="salvarModal('toc','🕊️')">🕊️ Inexistente</button>
                    <button data-valor="🫩" onclick="salvarModal('toc','🫩')">🫩 Fraco</button>
                    <button data-valor="👺" onclick="salvarModal('toc','👺')">👺 Forte</button>
                    <button data-valor="🤯" onclick="salvarModal('toc','🤯')">🤯 Muito forte</button>
                </div>
                <button class="limpar" onclick="limparModal('toc')">✕ Limpar</button>
            </div>

            <div class="grupo-variavel">
                <p class="titulo-variavel">📝 Anotação do dia</p>
                <textarea id="notaDia" class="campo-nota" placeholder="O que aconteceu hoje amiguinha?" oninput="salvarNota(this.value)"></textarea>
            </div>

            <button class="fechar" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <!-- Modal de gráficos -->
    <div id="modalGrafico" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Gráficos da Isa</h3>
            <canvas id="graficoMensal"></canvas>
            <br>
            <button class="voltar" onclick="fecharGrafico()">⬅️ Voltar para o Calendário</button>
        </div>
    </div>

    <!-- Importa Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Script principal -->
    <script src="script.js"></script>
    <script>

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("Service Worker registrado!"))
      .catch(error => console.log("Erro ao registrar Service Worker:", error));
  }
</script>

</body>
</html>
